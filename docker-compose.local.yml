version: '3.7'

services:
  selenium-hub:
    image: selenium/standalone-docker:4.22.0
    ports:
      - "4442-4444:4442-4444"
    environment:
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    volumes:
      - ./selenium-hub/config.toml:/opt/bin/config.toml
      - /var/run/docker.sock:/var/run/docker.sock

  alex-database:
    image: postgres:10
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=sa
      - POSTGRES_DB=alex
    volumes:
      - alex-database:/var/lib/postgresql

  alex-frontend:
    image: ghcr.io/learnlib/alex/alex-frontend:3.0.0
    environment:
      - ALEX_BACKEND_ADDRESS=http://localhost
      - ALEX_BACKEND_PORT=8000
    ports:
      - "80:4200"

  alex-backend:
    image: ghcr.io/learnlib/alex/alex-backend:3.0.0
    depends_on:
      - alex-database
      - selenium-hub
    volumes:
      - alex-database:/var/alex/backend/target/postgresql
    environment:
      - GRID_HOST=selenium-hub
      - GRID_PORT=4444
      - DATABASE_HOST=alex-database
      - DATABASE_PORT=5432
      - DATABASE_NAME=alex
      - DATABASE_USER=sa
      - DATABASE_PASSWORD=sa
      - RUNTIME=docker
    ports:
      - "8000:8000"

volumes:
  alex-database:
