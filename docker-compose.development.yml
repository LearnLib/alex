version: '3.7'

services:
    selenium-hub:
        image: selenium/standalone-docker:4.22.0
        ports:
            - "4442-4444:4442-4444"
        environment:
            - SE_EVENT_BUS_PUBLISH_PORT=4442
            - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
        volumes:
            - ./selenium-hub/config.toml:/opt/bin/config.toml
            - /var/run/docker.sock:/var/run/docker.sock

    alex-database:
        image: postgres:10
        environment:
            - POSTGRES_HOST_AUTH_METHOD=trust
            - POSTGRES_USER=sa
            - POSTGRES_DB=alex
        volumes:
            - alex-database:/var/lib/postgresql
        ports:
            - "5432:5432"

    alex-backend:
        build:
          dockerfile: ./dev.Dockerfile
          context: ./backend
        depends_on:
            - selenium-hub
            - alex-database
        environment:
            - DATABASE_HOST=alex-database
            - DATABASE_PORT=5432
            - DATABASE_NAME=alex
            - DATABASE_USER=sa
            - DATABASE_PASSWORD=sa
            - GRID_HOST=selenium-hub
            - GRID_PORT=4444
            - RUNTIME=docker
        develop:
            watch:
                - action: sync+restart
                  path: ./backend/src
                  target: /var/alex/backend/src
                - action: rebuild
                  path: ./backend/pom.xml
                  target: /var/alex/backend/src/pom.xml
        volumes:
            - alex-backend-maven:/root/.m2
            - alex-backend-ltsmin:/var/ltsmin
            - alex-database:/var/alex/backend/target/postgresql
        ports:
            - "5005:5005"
            - "8000:8000"
        command:
            bash -c "if [ ! -d "/var/ltsmin/bin" ]; then
            curl -fsSL -o /var/ltsmin/ltsmin-v3.0.2-linux.tgz https://github.com/utwente-fmt/ltsmin/releases/download/v3.0.2/ltsmin-v3.0.2-linux.tgz;
            tar -xzf /var/ltsmin/ltsmin-v3.0.2-linux.tgz -C /var/ltsmin;
            mv /var/ltsmin/v3.0.2/* /var/ltsmin/;
            rm -rf /var/ltsmin/v3.0.2 /var/ltsmin/ltsmin-v3.0.2-linux.tgz;
            fi && mvn spring-boot:run -Dspring-boot.run.jvmArguments="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005" -Dspring-boot.run.arguments=\"--ltsmin.path=/var/ltsmin/bin --spring.datasource.url=jdbc:postgresql://$${DATABASE_HOST}:$${DATABASE_PORT}/$${DATABASE_NAME} --spring.datasource.username=$${DATABASE_USER} --selenium.grid.host=$${GRID_HOST} --selenium.grid.port=$${GRID_PORT}\""

    alex-frontend:
        build:
            dockerfile: ./dev.Dockerfile
            context: ./frontend
        develop:
            watch:
                - action: sync
                  path: ./frontend/src
                  target: /var/alex/frontend/src
                  ignore:
                      - node_modules/
                      - e2e/
                - action: rebuild
                  path: ./frontend/package.json
                  target: /var/alex/frontend/src/package.json
        volumes:
            - /var/alex/frontend/node_modules
        ports:
            - "4200:4200"
        command: >
            bash -c "npm run start:docker"

volumes:
  alex-backend-maven:
  alex-backend-ltsmin:
  alex-database:
